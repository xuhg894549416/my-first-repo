<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的第一个 Git 仓库</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f7f7f8;
    color: #1f2937;
  }
  .card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 40px 48px;
    text-align: center;
    max-width: 420px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 12px;
  }
  p {
    font-size: 14px;
    line-height: 1.7;
    color: #6b7280;
    margin: 0 0 8px;
  }
  code {
    font-family: Consolas, Monaco, monospace;
    background: #f3f4f6;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
    color: #111827;
  }
  .badge {
    display: inline-block;
    margin-top: 20px;
    font-size: 12px;
    color: #059669;
    background: #ecfdf5;
    border-radius: 999px;
    padding: 4px 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>第一次提交成功</h1>
    <p>这个页面已经纳入了 Git 版本管理。</p>
    <p>试着改一行文字，然后运行 <code>git status</code> 看看变化。</p>
    <span class="badge">Git 练习项目</span>
  </div>
</body>
</html>
